<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="vnitBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#213B78" />
    </linearGradient>
    <linearGradient id="vnitAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E30613" />
      <stop offset="100%" stop-color="#B30006" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon: Geometric Industrial Emblem -->
  <g transform="translate(10, 10)">
    <!-- Red Chevron Accent -->
    <polygon points="5,42 22,25 22,12 5,29" fill="url(#vnitAccentGrad)" />
    <!-- Light Blue Diagonal Bar -->
    <polygon points="18,52 35,35 35,8 18,25" fill="#00A3E0" />
    <!-- Navy Blue Diagonal Bar -->
    <polygon points="31,52 48,35 48,8 31,25" fill="#213B78" />
    <!-- Precision Center Dot -->
    <circle cx="26.5" cy="30" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Typography VNIT -->
  <text x="75" y="44" font-family="'Exo', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="2" fill="#213B78">
    VNIT
  </text>
  
  <!-- Slogan / Subtitle -->
  <text x="76" y="58" font-family="'Exo', 'Roboto', Arial, sans-serif" font-weight="600" font-size="9" letter-spacing="1.5" fill="#0082C4">
    ENGINEERING &amp; INSPECTION
  </text>
  <text x="76" y="68" font-family="'Exo', 'Roboto', Arial, sans-serif" font-weight="400" font-size="7.5" letter-spacing="0.5" fill="#666666">
    DỊCH VỤ KỸ THUẬT &amp; HIỆU CHUẨN ĐO LƯỜNG
  </text>
</svg>
